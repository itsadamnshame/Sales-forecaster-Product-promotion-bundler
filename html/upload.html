<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset - AI Dashboard</title>
    <link rel="stylesheet" href="style/global-style.css">
    <link rel="stylesheet" href="style/home.css">
</head>
<body>
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 41, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center;">
        <div class="spinner" style="border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 70px; height: 70px; animation: spin 1.5s linear infinite; margin-bottom: 25px;"></div>
        <h2 id="loading-text" style="letter-spacing: 2px;">AI MODELS ARE COMPUTING...</h2>
        <p style="color: #bdc3c7; max-width: 400px; line-height: 1.6;">Please wait while the system processes your dataset for Forecasting, Market Bundling, and Influence Analysis.</p>
    </div>

    <div class="header">
        <div class="header-left">
            <p>DATASET MANAGEMENT</p>
        </div>
    </div>

    <div class='upload-container' style="padding: 40px; text-align: center;">
        <div class='upload-box' style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; text-align: left;">
            <form id="upload" method="POST" enctype='multipart/form-data'>
                <div style="margin-bottom: 15px;">
                    <label for='filename'>File Description:</label><br>
                    <input type='text' name='filename' id="filename" placeholder="e.g. Sales 2022-2025" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label for='datafile'>Select Excel File:</label><br>
                    <input type='file' name='datafile' id="datafile" accept='.xlsx, .xls' required style="margin-top: 5px;">
                </div>
                <button type='submit' id="upload-btn" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Upload to Server</button>
            </form>
        </div>

        <div id="runPy" style="margin-top: 30px;">
            </div>
        
        <div style="margin-top: 20px;">
            <a href="homepage.html" style="color: #7f8c8d; text-decoration: none;">← Cancel and Go back</a>
        </div>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #toPy {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            transition: transform 0.2s;
        }
        #toPy:hover { transform: scale(1.05); }
    </style>

    <script src="js/utils.js"></script>
    <script src="/session.js"></script>
</body>
</html>
