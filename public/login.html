<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Optima</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-copy">
                <p class="eyebrow">Sales Analytics System</p>
                <h1>Welcome back to Optima</h1>
                <p class="subtitle">Sign in to access forecasting, market basket analysis, and influence tracking.</p>
            </div>

            <form id="login-form" method="POST" class="login-form">
                <label for="uname">Username</label>
                <input type="text" name="uname" id="uname" placeholder="Enter your username" required>

                <label for="pss">Password</label>
                <input type="password" name="pass" id="pss" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>
        </section>
    </main>
    <script src="session.js"></script>
</body>
</html>
